name: Check llms-full.txt is up to date

on:
  # no `paths:` filter: `check-drift` is the check the merge queue waits for, and a required check that
  # never reports blocks the merge button (a README-only PR would sit unmergeable). The job costs ~0.1 min.
  pull_request:
  push:
    branches: [main]
  # merge queue: a queued group (main + the PRs ahead + this one) is merged only when the checks required
  # on main report on the merge_group ref; without this trigger an enqueued PR waits forever.
  merge_group:
    branches: [main]

# one run per PR head — a second push cancels the first. A merge-group run is never cancelled: each group
# has its own ref, and cancelling one would drop its PRs from the queue.
concurrency:
  group: check-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate llms-full.txt
        run: ./scripts/build-llms-full.sh /tmp/llms-full.generated.txt

      - name: Diff against committed llms-full.txt
        run: |
          if ! diff -u llms-full.txt /tmp/llms-full.generated.txt; then
            echo "::error::llms-full.txt is out of sync with SKILL.md / references."
            echo "Run ./scripts/build-llms-full.sh locally and commit the result."
            exit 1
          fi
          echo "llms-full.txt is up to date."
