name: Check llms-full.txt is up to date

# Runs on every pull request, not only on the paths that can change llms-full.txt:
# a required status check that never reports blocks the merge button, so a
# README-only PR could not merge once `check-drift` is required. The job costs
# ~0.1 min; the drift result on an unrelated PR is simply "up to date".
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate llms-full.txt
        run: ./scripts/build-llms-full.sh /tmp/llms-full.generated.txt

      - name: Diff against committed llms-full.txt
        run: |
          if ! diff -u llms-full.txt /tmp/llms-full.generated.txt; then
            echo "::error::llms-full.txt is out of sync with SKILL.md / references."
            echo "Run ./scripts/build-llms-full.sh locally and commit the result."
            exit 1
          fi
          echo "llms-full.txt is up to date."
