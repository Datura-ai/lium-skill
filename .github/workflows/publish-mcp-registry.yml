name: Publish to the MCP Registry

# The registry refuses a version it already holds, so bump `version` in server.json with every change.
on:
  push:
    branches: [main]
    paths: [server.json]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `mcp-publisher login github-oidc` proves the io.github.Datura-ai namespace with this token.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # This job holds id-token: write, so the binary is pinned and checked before it runs.
      # To upgrade: change both values to a reviewed release and its line in registry_<version>_checksums.txt.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
